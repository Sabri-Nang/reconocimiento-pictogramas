[project]
name = "reconocimiento-pictogramas"
version = "0.1.0"
description = "Aplicación local para reconocer pictogramas y generar frases asistivas."
readme = "README.md"
authors = [
    { name = "Sabrina Sanches", email = "sabrinadelosangelessanches@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio>=6.28.0",
    "gtts>=2.5,<3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[project.scripts]
reconocimiento-pictogramas = "reconocimiento_pictogramas:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
